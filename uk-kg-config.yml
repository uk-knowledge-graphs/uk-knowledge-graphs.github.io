title: UK Interest Group on Knowledge Graphs
description: A UK community for knowledge graphs, supported by the Open Data Institute.
url: "https://example.org"
baseurl: ""
markdown: kramdown
collections:
  meetups:
    output: true
    permalink: /meetups/:name/
  symposiums:
    output: true
    permalink: /symposiums/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: meetups
    values:
      layout: event
      event_type: Online meet-up
  - scope:
      type: symposiums
    values:
      layout: event
      event_type: In-person symposium
