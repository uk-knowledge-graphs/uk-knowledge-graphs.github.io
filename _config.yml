title: UK Knowledge Graphs Interest Group
description: A UK community for knowledge graphs, bringing together research, practice and education.
url: "https://uk-knowledge-graphs.github.io"
baseurl: ""
lang: en-GB
markdown: kramdown
permalink: pretty
collections:
  events:
    output: true
    permalink: /events/:name/
defaults:
  - scope:
      path: ""
      type: events
    values:
      layout: event
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _templates
