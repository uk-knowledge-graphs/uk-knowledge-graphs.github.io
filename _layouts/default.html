<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="UK Knowledge Graphs home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>UK <strong>Knowledge Graphs</strong><small>Interest Group</small></span>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ '/events/' | relative_url }}" {% if page.url contains '/events/' %}aria-current="page"{% endif %}>Events</a>
        <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains '/teaching/' %}aria-current="page"{% endif %}>Teaching</a>
        <a href="{{ '/#chairs' | relative_url }}">Chairs</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">
    <div class="container footer-grid">
      <div><a class="footer-brand" href="{{ '/' | relative_url }}">UK Knowledge Graphs</a>
      <p>A community for people researching, building, applying and teaching knowledge graphs in the UK.</p></div>
      <div><strong>Explore</strong><a href="{{ '/events/' | relative_url }}">Events</a><a href="{{ '/teaching/' | relative_url }}">Teaching materials</a><a href="{{ '/#chairs' | relative_url }}">Chairs</a></div>
      <div><strong>Contact point</strong><a href="{{ site.data.contact.linkedin | escape }}">LinkedIn group</a><a href="{{ site.data.contact.google_group | escape }}">Google group</a>
	  <!-- <a href="mailto:{{ site.data.contact.email | escape }}">Email the group</a> -->
      <!-- <span>Supported by the Open Data Institute</span></div> -->
    </div>
    <!--<div class="container footnote">A relaunch of the <a href="https://www.turing.ac.uk/research/interest-groups/knowledge-graphs">Knowledge Graphs Interest Group at The Alan Turing Institute</a>.</div>-->
  </footer>
</body>
</html>
